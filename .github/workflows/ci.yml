name: CI

on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [master]
    paths-ignore: ['**.md']

# A newer push to a PR cancels that PR's older run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test, clippy, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Only master saves the cache; PRs restore it and skip the upload.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Doc tests
        run: cargo test --doc
      # The always-on checks (duplicate state type, user decision D1; double trigger; composite
      # without a constructor; the on_enter cycle guard) must also fire without debug assertions.
      # Only a release build can tell `assert!` from `debug_assert!`.
      - name: Test (release)
        run: cargo test --release --all-targets
